name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages serves from the gh-pages branch (legacy build type), so the job needs
# write access to push the built site there.
permissions:
  contents: write

# Never let two deploys race; queue them instead of cancelling a push midway.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gh-pages fetches the existing remote branch to build its commit on.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `build` is `tsc -b && vite build`, so a type error fails the deploy.
      - run: npm run build

      # gh-pages publishes from its own clone in node_modules/.cache, which does
      # not inherit the credentials actions/checkout writes into this repo's git
      # config — so the remote has to carry the token explicitly.
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d dist --dotfiles \
            -m "Deploy ${GITHUB_SHA}" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
