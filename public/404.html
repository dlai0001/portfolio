<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>

    <!--
      GitHub Pages serves this file for any path it can't find (e.g. deep links
      like /portfolio/projects/learn-chinese-news visited directly).
      Encode the requested path into a `?p=` query param and redirect to the
      app root. index.html reads `p` and restores the real URL via
      history.replaceState before React Router mounts.
    -->
    <script>
      (function () {
        var l = window.location;
        var path = l.pathname + l.search + l.hash;
        l.replace('/portfolio/?p=' + encodeURIComponent(path));
      })();
    </script>

    <!-- Prevent indexing of this redirect page -->
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
